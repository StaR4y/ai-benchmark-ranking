name: Update leaderboards

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/update-leaderboards.yml"
      - ".mvn/**"
      - "mvnw"
      - "pom.xml"
      - "src/**"
  schedule:
    # At minute 17 of every hour. Scheduled jobs may start a little late.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-leaderboards
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build executable JAR
        run: ./mvnw --batch-mode --no-transfer-progress package

      - name: Refresh JSON and charts
        env:
          CRAWLER_USER_AGENT: >-
            BenchmarkLadderBot/1.0 (+${{ github.server_url }}/${{ github.repository }})
          REQUEST_DELAY_MS: "1500"
        run: |
          java -jar target/benchmark-ladder-1.0.0.jar \
            snapshot --output-dir . --all-themes --refresh

      - name: Commit changed artifacts
        shell: bash
        run: |
          git add data charts
          if git diff --cached --quiet; then
            echo "### No leaderboard changes" >> "$GITHUB_STEP_SUMMARY"
            echo "Both upstream leaderboards matched the committed snapshots." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): update leaderboard snapshots"
          git push
