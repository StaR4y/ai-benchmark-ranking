name: Update leaderboards

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/update-leaderboards.yml"
      - ".mvn/**"
      - "mvnw"
      - "pom.xml"
      - "src/**"
  schedule:
    # At minute 17 of every hour. Scheduled jobs may start a little late.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-leaderboards
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build executable JAR
        run: ./mvnw --batch-mode --no-transfer-progress package

      - name: Refresh JSON and charts
        env:
          CRAWLER_USER_AGENT: >-
            BenchmarkLadderBot/1.0 (+${{ github.server_url }}/${{ github.repository }})
          REQUEST_DELAY_MS: "1500"
          WORKFLOW_RUN_URL: >-
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          java -jar target/benchmark-ladder-1.0.0.jar \
            snapshot --output-dir . --all-themes --refresh
          jq -n \
            --arg checkedAt "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg workflowRun "$WORKFLOW_RUN_URL" \
            --arg sourceCommit "$SOURCE_COMMIT" \
            --slurpfile programbench data/programbench.json \
            --slurpfile frontierbench data/frontierbench.json \
            '{
              checkedAt: $checkedAt,
              workflowRun: $workflowRun,
              sourceCommit: $sourceCommit,
              sites: {
                programbench: {entryCount: ($programbench[0].entries | length)},
                frontierbench: {entryCount: ($frontierbench[0].entries | length)}
              }
            }' > data/last-check.json

      - name: Commit changed artifacts
        shell: bash
        run: |
          git add data charts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): refresh leaderboard snapshots"
          git push
